<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger Queen Login</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="container">
        <!-- Left Side -->
        <div class="left-panel">
            <div class="logo">
                <!-- Replace logo.png later -->
                <img src="./images/logo.png" alt="Logo">
            </div>

            <h1>Burger Queen</h1>
            <p class="portal-text">EMPLOYEE PORTAL</p>

            <form class="login-form">

                <label for="employee-id">Employee ID</label>
                <div class="input-box">
                    <i class="fas fa-user"></i>
                    <input id="employee-id" type="text">
                </div>

                <label for="password">Password</label>
                <div class="input-box">
                    <i class="fas fa-lock"></i>
                    <input id="password" type="password">
                    <i class="fas fa-eye"></i>
                </div>

                <button type="button" onclick="window.location.href='pages/dashboard.html'">LOGIN</button>
                <!-- TODO:  -->

                <p class="help-text">
                    Need help? Contact IT Support
                </p>

                <p class="authorized">
                    <i class="fas fa-lock"></i>
                    Authorized personnel only
                </p>

            </form>

        </div>

        <!-- Right Side -->
        <div class="right-panel">
            <div class="overlay"></div>
            <div class="content">
                <h2>
                    Manage the<br>
                    Queen's inventory<br>
                    <span>with ease.</span>
                </h2>
                <div class="line"></div>
                <p>
                    Keep track of ingredients,
                    stock, and supplies in one
                    place.
                </p>
            </div>
        </div>
    </div>
</body>

</html>
