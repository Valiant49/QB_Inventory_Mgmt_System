<dialog class="warning" id="supplier-warning">
    <div class="warning--sign-container">
        <img src="Polygon 1.svg" alt="Warning Symbol" class="warning--image">
        <h1 class="exclamation">!</h1>
    </div>
    <p class="warning--description">Are you sure you want to remove this supplier?</p>
    <p class="warning--description">This action cannot be undone.</p>
    <div class="warning--yes-no-container">
        <button class="warning--cancel-btn" onclick="hideWarning()">Cancel</button>
        <a href="suppliers.html"><button class="warning--remove-btn">Remove</button></a>
    </div>
</dialog>
