<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <dialog class="suppliers__modal" id="supplier-modal">
            <h1 class="suppliers__modal--title">Add Supplier</h1>
            <form action="" method="get" class="suppliers__modal--form">
                <div class="suppliers__modal--form-section">
                    <h2 class="suppliers__modal--subtitle">Supplier Identification</h2>
                    <div class="suppliers__modal--form-item">
                        <label for="supplier-name" class="suppliers__modal--label">Supplier Name</label>
                        <input type="text" class="suppliers__modal--input">
                    </div>
                    <div class="suppliers__modal--form-item">
                        <label for="supplier-code" class="suppliers__modal--label">Supplier Code</label>
                        <input type="text" class="suppliers__modal--input">
                    </div>
                    <div class="suppliers__modal--form-item">
                        <label for="supplier-name" class="suppliers__modal--label">Supplier Name</label>
                        <input type="text" class="suppliers__modal--input">
                    </div>
                    <div class="suppliers__modal--form-item">
                        <label for="supply-type" class="suppliers__modal--label">Supply Type</label>
                        <select class="suppliers__modal--dropdown">
                            <option value="please-select">Please Select</option>
                            <option value="patty">Patty</option>
                            <option value="buns">Buns</option>
                            <option value="vegetables">Vegetables</option>
                            <option value="dairy">Dairy</option>
                        </select>
                    </div>
                    <div class="suppliers__modal--form-item">
                        <label for="supply-status" class="suppliers__modal--label">Status</label>
                        <select class="suppliers__modal--dropdown">
                            <option value="please-select">Please Select</option>
                            <option value="available">Available</option>
                            <option value="low-stock">Low Stock</option>
                            <option value="out-of-stock">Out of Stock</option>
                        </select>
                    </div>
                </div>

                <div class="suppliers__modal--form-section">
                    <h2 class="suppliers__modal--subtitle">Contact Person</h2>
                    <div class="suppliers__modal--form-section">
                        <div class="suppliers__modal--form-item">  
                            <label for="branch-manager" class="suppliers__modal--label">Branch Manager</label>
                            <input type="text" class="suppliers__modal--input">
                        </div>
                        <div class="suppliers__modal--form-item">
                            <label for="email" class="suppliers__modal--label">Email Address</label>
                            <input type="email" class="suppliers__modal--input">
                        </div>
                        <div class="suppliers__modal--form-item">
                            <label for="contact-num" class="suppliers__modal--label">Contact Number</label>
                            <input type="text" class="suppliers__modal--input">
                        </div>
                    </div>
                </div>
                
                <div class="suppliers__modal--form-section">
                    <h2 class="suppliers__modal--subtitle">Branch Location</h2>
                    <div class="suppliers__modal--form-section">
                        <label for="address" class="suppliers__modal--label">Address</label>
                        <input type="text" class="suppliers__modal--input">
                    </div>
                    <div class="suppliers__modal--form-section">
                        <label for="city-municipalty" class="suppliers__modal--label">City/Municipality</label>
                        <input type="text" class="suppliers__modal--input">
                    </div>
                    <div class="suppliers__modal--form-section">
                        <label for="province-region" class="suppliers__modal--label">Province/Region</label>
                        <input type="text" class="suppliers__modal--input">
                    </div>
                    <div class="suppliers__modal--form-section">
                        <label for="zip-code" class="suppliers__modal--label">Zip Code</label>
                        <input type="text" class="suppliers__modal--input">
                    </div>
                    <div class="suppliers__modal--form-section">
                        <label for="notes" class="suppliers__modal--label">Notes</label>
                        <input type="text" class="suppliers__modal--long-input">
                    </div>
                </div>
                <div class="suppliers__modal--add-cancel-container">
                    <button class="suppliers__modal--cancel-btn" onclick="hideForm()">Cancel</button>
                    <a href="suppliers.html"><button class="suppliers__modal--add-btn">Add Supplier</button></a>
                </div>
            </form>
        </dialog>
</body>
</html>
